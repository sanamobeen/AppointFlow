
name: AppointFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  project-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          test -d backend
          test -d frontend
          test -d docs
          echo "AppointFlow project structure is valid."

